name: Issue 14 - strict release blockers audit
on:
  push:
    branches:
      - issue-14-hz-discovery-v1.1.3
    paths:
      - tests/test_issue14_release_audit.py
      - .github/workflows/issue14-release-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope_and_delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout untouched candidate into isolated audit workspace
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout unchanged v1.1.2 tag
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: v1.1.2
      - name: Use Python 3.11 identical to app Dockerfile runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Jinja template engine used by original-functions harness
        run: python -m pip install 'Jinja2>=3,<4'
      - name: Compile actual candidate and baseline with Python 3.11
        run: |
          python -m py_compile baseline/wem_mqtt_unified/script.py
          python -m py_compile candidate/wem_mqtt_unified/script.py
      - name: Check strict functional scope and targeted MQTT delivery failure
        env:
          WEM_V112_SRC: ${{ github.workspace }}/baseline/wem_mqtt_unified/script.py
        run: python -m unittest discover -s candidate/tests -p 'test_issue14_release_audit.py' -v
