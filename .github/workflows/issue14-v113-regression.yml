name: Issue 14 v1.1.3 isolated regression
on:
  push:
    branches:
      - issue-14-hz-discovery-v1.1.3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v1.1.3 development branch
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout immutable v1.1.2 tag
        uses: actions/checkout@v4
        with:
          ref: v1.1.2
          path: baseline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install template engine for isolated tests
        run: python -m pip install 'Jinja2>=3,<4'
      - name: Test actual source functions from both versions
        env:
          WEM_V112_SRC: ${{ github.workspace }}/baseline/wem_mqtt_unified/script.py
        run: python -m unittest discover -s candidate/tests -p 'test_issue14_v113.py' -v
      - name: Full Python syntax compile
        run: |
          python -m py_compile candidate/wem_mqtt_unified/script.py
          python -m py_compile baseline/wem_mqtt_unified/script.py
      - name: Start isolated local MQTT broker (not user's Home Assistant)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          printf '%s\\n' 'listener 18883 127.0.0.1' 'allow_anonymous true' 'persistence false' | sudo tee /etc/mosquitto/conf.d/wem_issue14.conf >/dev/null
          sudo chmod 644 /etc/mosquitto/conf.d/wem_issue14.conf
          sudo mosquitto -c /etc/mosquitto/conf.d/wem_issue14.conf -d
          python -m pip install 'paho-mqtt>=2,<3'
      - name: Test retained discovery upgrade with real local Mosquitto
        env:
          WEM_V112_SRC: ${{ github.workspace }}/baseline/wem_mqtt_unified/script.py
          WEM_TEST_MQTT_PORT: '18883'
        run: python -m unittest discover -s candidate/tests -p 'test_issue14_mqtt_broker.py' -v
