name: Issue 14 isolated real Home Assistant Core integration
on:
  push:
    branches:
      - issue-14-hz-discovery-v1.1.3
    paths:
      - tests/test_issue14_ha_core.py
      - tests/test_issue14_ha_core_cold.py
      - wem_mqtt_unified/script.py
      - .github/workflows/issue14-ha-core-integration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home_assistant_mqtt_integration:
    name: HA Core upgrade audit ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - bad_config_first
          - bad_state_first
          - normalized_config_first
          - normalized_state_first
    steps:
      - name: Checkout candidate v1.1.3 development branch
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout unchanged v1.1.2 tag
        uses: actions/checkout@v4
        with:
          ref: v1.1.2
          path: baseline
      - name: Start disposable loopback-only MQTT broker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          echo 'listener 18884 127.0.0.1' | sudo tee /etc/mosquitto/conf.d/wem_issue14_ha.conf >/dev/null
          echo 'allow_anonymous true' | sudo tee -a /etc/mosquitto/conf.d/wem_issue14_ha.conf >/dev/null
          echo 'persistence false' | sudo tee -a /etc/mosquitto/conf.d/wem_issue14_ha.conf >/dev/null
          sudo chmod 644 /etc/mosquitto/conf.d/wem_issue14_ha.conf
          sudo mosquitto -c /etc/mosquitto/conf.d/wem_issue14_ha.conf -d
          sleep 2
          python3 -c "import socket; s=socket.create_connection(('127.0.0.1',18884),5); s.close(); print('Isolated MQTT broker ready')"
      - name: Run official HA Core 2026.10.2 with real MQTT integration
        shell: bash
        timeout-minutes: 16
        env:
          WEM_HA_TEST_MQTT_PORT: '18884'
        run: |
          set -euo pipefail
          docker pull ghcr.io/home-assistant/home-assistant:2026.10.2
          timeout --signal=TERM --kill-after=20s 720s docker run --rm \
            --network host \
            --entrypoint python3 \
            -v "$PWD/candidate:/candidate:ro" \
            -v "$PWD/baseline:/baseline:ro" \
            -e WEM_V112_SRC=/baseline/wem_mqtt_unified/script.py \
            -e WEM_HA_TEST_MQTT_PORT=18884 \
            -e WEM_UPGRADE_SCENARIO=${{ matrix.scenario }} \
            ghcr.io/home-assistant/home-assistant:2026.10.2 \
            /candidate/tests/test_issue14_ha_core.py
      - name: Check clean startup from retained v1.1.3 Discovery
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 420s docker run --rm \
            --network host \
            --entrypoint python3 \
            -v "$PWD/candidate:/candidate:ro" \
            -v "$PWD/baseline:/baseline:ro" \
            -e WEM_V112_SRC=/baseline/wem_mqtt_unified/script.py \
            -e WEM_HA_TEST_MQTT_PORT=18884 \
            ghcr.io/home-assistant/home-assistant:2026.10.2 \
            /candidate/tests/test_issue14_ha_core_cold.py
